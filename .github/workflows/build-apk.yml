name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release Asset
        id: prep
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG_NAME="v-${SHORT_SHA}"
          ASSET_NAME="deriv-gold-bot-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET_NAME}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: "Release ${{ steps.prep.outputs.tag_name }}"
          draft: false
          prerelease: false
          make_latest: "true"
          files: ${{ steps.prep.outputs.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## Build and Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Commit (GITHUB_SHA):** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact Name:** \`app-debug\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Status:** Stored and available in run artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Source APK Path:** \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "### GitHub Release: :white_check_mark: Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`${{ steps.prep.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Asset:** \`${{ steps.prep.outputs.asset_name }}\` (Directly downloadable)" >> $GITHUB_STEP_SUMMARY
            echo "- **Latest Status:** Explicitly marked as latest" >> $GITHUB_STEP_SUMMARY
          else
            echo "### GitHub Release: :x: Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Outcome:** ${{ steps.create_release.outcome }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Note:** The Actions artifact (\`app-debug\`) remains preserved and downloadable." >> $GITHUB_STEP_SUMMARY
          fi
